name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: détection de secrets (historique complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hooks-and-tests:
    name: hooks pre-commit et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Les tests de configuration n'ont pas besoin du SDK (lourd) : installation sans dépendances.
      - run: pip install pre-commit pytest python-dotenv numpy && pip install --no-deps -e .
      - run: pre-commit run --all-files
      - run: pytest
